<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Fondo de atardecer en piedra travertino -->
    <radialGradient id="sunsetSky" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FDF3E7" />
      <stop offset="35%" stop-color="#F7E2CE" />
      <stop offset="70%" stop-color="#ECD0B9" />
      <stop offset="100%" stop-color="#DFC0A5" />
    </radialGradient>

    <!-- Resplandor solar dorado -->
    <radialGradient id="sunFlare" cx="30%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#EB9134" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#DE6536" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0" />
    </radialGradient>

    <!-- Sombra de contacto suave -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Sombra difusa de la montura -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#261814" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#261814" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#261814" stop-opacity="0" />
    </radialGradient>

    <!-- Acetato Negro Obsidiana con Bisel Cálido -->
    <linearGradient id="blackAcetate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#362824" />
      <stop offset="30%" stop-color="#201513" />
      <stop offset="70%" stop-color="#140D0B" />
      <stop offset="100%" stop-color="#2B1E1A" />
    </linearGradient>

    <!-- Reflejo de borde biselado cálido -->
    <linearGradient id="bevelLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAA168" stop-opacity="0.8" />
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#DE6536" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#140D0B" />
    </linearGradient>

    <!-- Mica Polarizada con Reflejo de Atardecer -->
    <linearGradient id="sunsetLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1210" />
      <stop offset="45%" stop-color="#2D1A15" />
      <stop offset="75%" stop-color="#5A2E1F" />
      <stop offset="90%" stop-color="#EB9134" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0.9" />
    </linearGradient>

    <!-- Destello especular de lente -->
    <linearGradient id="lensGleam" x1="0%" y1="0%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="60%" stop-color="#EB9134" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0.35" />
    </linearGradient>

    <!-- Acero cepillado puente -->
    <linearGradient id="brushedSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9C8B82" />
      <stop offset="30%" stop-color="#D8CEC7" />
      <stop offset="50%" stop-color="#FFF9F5" />
      <stop offset="70%" stop-color="#B0A096" />
      <stop offset="100%" stop-color="#7C6E66" />
    </linearGradient>
  </defs>

  <!-- Fondo de estudio al atardecer -->
  <rect width="800" height="600" fill="url(#sunsetSky)" />
  <circle cx="280" cy="180" r="320" fill="url(#sunFlare)" />

  <!-- Líneas sutiles de horizonte de estudio -->
  <line x1="0" y1="480" x2="800" y2="480" stroke="#DE6536" stroke-opacity="0.08" stroke-width="1" />
  <line x1="0" y1="520" x2="800" y2="520" stroke="#DE6536" stroke-opacity="0.05" stroke-width="1" />

  <!-- Sombra de suelo ovalada -->
  <ellipse cx="400" cy="425" rx="310" ry="45" fill="url(#groundShadow)" />
  <ellipse cx="400" cy="422" rx="240" ry="25" fill="#261814" fill-opacity="0.25" />

  <!-- MONTURA PRINCIPAL: MR-01 ORION MONOLITH -->
  <g filter="url(#shadowFilter)">
    <!-- Varilla izquierda en perspectiva detrás -->
    <path d="M 170 300 Q 130 290 85 305 Q 75 308 65 315 L 75 320 Q 95 308 140 304 L 175 310 Z" fill="#201513" opacity="0.65" />
    
    <!-- Varilla derecha en perspectiva detrás -->
    <path d="M 630 300 Q 670 290 715 305 Q 725 308 735 315 L 725 320 Q 705 308 660 304 L 625 310 Z" fill="#201513" opacity="0.65" />

    <!-- Ojo Izquierdo: Marco exterior en acetato negro biselado -->
    <path d="M 165 240 L 360 240 Q 375 240 375 255 L 365 365 Q 365 385 345 385 L 185 385 Q 165 385 165 365 L 155 255 Q 155 240 165 240 Z" fill="url(#blackAcetate)" stroke="url(#bevelLight)" stroke-width="2.5" />

    <!-- Ojo Izquierdo: Lente mineral polarizada con degradado atardecer -->
    <path d="M 180 255 L 345 255 Q 355 255 355 268 L 348 355 Q 348 370 332 370 L 198 370 Q 182 370 182 355 L 175 268 Q 175 255 180 255 Z" fill="url(#sunsetLens)" />
    <!-- Destello y reflejo en lente izquierda -->
    <path d="M 180 255 L 345 255 Q 355 255 355 268 L 348 355 Q 348 370 332 370 L 198 370 Q 182 370 182 355 L 175 268 Q 175 255 180 255 Z" fill="url(#lensGleam)" />
    <!-- Línea de horizonte reflejada en la lente -->
    <path d="M 180 325 Q 260 320 350 323 L 348 355 Q 348 370 332 370 L 198 370 Q 182 370 182 355 Z" fill="#DE6536" fill-opacity="0.3" />

    <!-- Puente Central Arquitectónico de Acero 316L -->
    <path d="M 360 270 Q 400 262 440 270 L 440 286 Q 400 278 360 286 Z" fill="url(#brushedSteel)" stroke="#261814" stroke-width="1.2" />
    <line x1="385" y1="272" x2="385" y2="284" stroke="#7C6E66" stroke-width="1" />
    <line x1="415" y1="272" x2="415" y2="284" stroke="#7C6E66" stroke-width="1" />

    <!-- Ojo Derecho: Marco exterior en acetato negro biselado -->
    <path d="M 435 240 L 630 240 Q 640 240 645 255 L 635 365 Q 635 385 615 385 L 455 385 Q 435 385 435 365 L 425 255 Q 425 240 435 240 Z" fill="url(#blackAcetate)" stroke="url(#bevelLight)" stroke-width="2.5" />

    <!-- Ojo Derecho: Lente mineral polarizada con degradado atardecer -->
    <path d="M 450 255 L 615 255 Q 625 255 625 268 L 618 355 Q 618 370 602 370 L 468 370 Q 452 370 452 355 L 445 268 Q 445 255 450 255 Z" fill="url(#sunsetLens)" />
    <!-- Destello y reflejo en lente derecha -->
    <path d="M 450 255 L 615 255 Q 625 255 625 268 L 618 355 Q 618 370 602 370 L 468 370 Q 452 370 452 355 L 445 268 Q 445 255 450 255 Z" fill="url(#lensGleam)" />
    <!-- Línea de horizonte reflejada en la lente derecha -->
    <path d="M 450 325 Q 530 320 620 323 L 618 355 Q 618 370 602 370 L 468 370 Q 452 370 452 355 Z" fill="#DE6536" fill-opacity="0.3" />

    <!-- Remaches de latón frontales en las esquinas superiores -->
    <circle cx="170" cy="252" r="2.2" fill="#E8B878" stroke="#261814" stroke-width="0.8" />
    <circle cx="176" cy="252" r="2.2" fill="#E8B878" stroke="#261814" stroke-width="0.8" />
    <circle cx="624" cy="252" r="2.2" fill="#E8B878" stroke="#261814" stroke-width="0.8" />
    <circle cx="630" cy="252" r="2.2" fill="#E8B878" stroke="#261814" stroke-width="0.8" />

    <!-- Reflejos de bisel superior en marfil -->
    <path d="M 175 242 L 355 242" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 445 242 L 625 242" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Píldora de Etiqueta Técnica en esquina -->
  <g transform="translate(40, 40)">
    <rect width="180" height="34" rx="17" fill="#261814" fill-opacity="0.85" />
    <circle cx="20" cy="17" r="4.5" fill="#DE6536" />
    <text x="34" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#FAF5EE" letter-spacing="1">MR-01 // ORION</text>
  </g>

  <!-- Píldora de Calibración en esquina inferior derecha -->
  <g transform="translate(600, 525)">
    <rect width="160" height="30" rx="15" fill="#DE6536" fill-opacity="0.9" />
    <text x="80" y="19" font-family="monospace" font-size="10.5" font-weight="700" fill="#FAF5EE" text-anchor="middle" letter-spacing="1.2">54▪18-145 • UV400</text>
  </g>
</svg>
