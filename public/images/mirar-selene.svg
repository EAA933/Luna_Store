<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Fondo de atardecer cálido en piedra caliza -->
    <radialGradient id="seleneSky" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF5EA" />
      <stop offset="35%" stop-color="#FCEAD5" />
      <stop offset="70%" stop-color="#F4D5BA" />
      <stop offset="100%" stop-color="#E5BE9B" />
    </radialGradient>

    <!-- Resplandor solar miel / ámbar -->
    <radialGradient id="honeyFlare" cx="70%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#F0A84E" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#DE6536" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0" />
    </radialGradient>

    <!-- Sombra de suelo suave -->
    <radialGradient id="groundShadow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B2019" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#3B2019" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3B2019" stop-opacity="0" />
    </radialGradient>

    <!-- Acetato Carey Ámbar Miel Vegetal -->
    <linearGradient id="amberTortoise" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A85722" />
      <stop offset="25%" stop-color="#6E3114" />
      <stop offset="50%" stop-color="#D97A2C" />
      <stop offset="75%" stop-color="#4A1E0C" />
      <stop offset="100%" stop-color="#C96B26" />
    </linearGradient>

    <!-- Bisel dorado traslúcido -->
    <linearGradient id="amberGlowBorders" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD699" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#F5A04D" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#4A1E0C" />
    </linearGradient>

    <!-- Mica Mineral Ámbar Puesta de Sol -->
    <linearGradient id="amberLensGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#381D13" />
      <stop offset="40%" stop-color="#5C2D18" />
      <stop offset="70%" stop-color="#B85923" />
      <stop offset="90%" stop-color="#F0A045" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0.95" />
    </linearGradient>

    <!-- Reflejo curvo superior -->
    <linearGradient id="curvedHighlight" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#F0A045" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0.4" />
    </linearGradient>

    <filter id="shadowFilter2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="22" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fondo de estudio -->
  <rect width="800" height="600" fill="url(#seleneSky)" />
  <circle cx="580" cy="160" r="300" fill="url(#honeyFlare)" />

  <!-- Sombra sobre la mesa -->
  <ellipse cx="400" cy="425" rx="300" ry="42" fill="url(#groundShadow2)" />
  <ellipse cx="400" cy="422" rx="230" ry="24" fill="#3B2019" fill-opacity="0.2" />

  <!-- MONTURA: MR-02 SELENE ARCH (ARCO BOTÁNICO DE CAREY) -->
  <g filter="url(#shadowFilter2)">
    <!-- Varillas en perspectiva detrás -->
    <path d="M 195 285 Q 150 270 95 290 Q 80 295 70 305 L 80 310 Q 110 295 160 292 L 200 300 Z" fill="#6E3114" opacity="0.6" />
    <path d="M 605 285 Q 650 270 705 290 Q 720 295 730 305 L 720 310 Q 690 295 640 292 L 600 300 Z" fill="#6E3114" opacity="0.6" />

    <!-- Ojo Izquierdo Redondeado Esculpido -->
    <ellipse cx="280" cy="305" rx="100" ry="92" fill="url(#amberTortoise)" stroke="url(#amberGlowBorders)" stroke-width="4" />
    <!-- Lente Izquierda -->
    <ellipse cx="280" cy="305" rx="82" ry="74" fill="url(#amberLensGradient)" />
    <ellipse cx="280" cy="305" rx="82" ry="74" fill="url(#curvedHighlight)" />
    <!-- Reflejo inferior cálido de atardecer -->
    <path d="M 215 320 Q 280 370 345 320 Q 320 375 280 375 Q 240 375 215 320 Z" fill="#DE6536" fill-opacity="0.4" />

    <!-- Puente de Carey con Curva en Arco -->
    <path d="M 370 275 Q 400 255 430 275 Q 425 295 400 282 Q 375 295 370 275 Z" fill="url(#amberTortoise)" stroke="url(#amberGlowBorders)" stroke-width="2" />

    <!-- Ojo Derecho Redondeado Esculpido -->
    <ellipse cx="520" cy="305" rx="100" ry="92" fill="url(#amberTortoise)" stroke="url(#amberGlowBorders)" stroke-width="4" />
    <!-- Lente Derecha -->
    <ellipse cx="520" cy="305" rx="82" ry="74" fill="url(#amberLensGradient)" />
    <ellipse cx="520" cy="305" rx="82" ry="74" fill="url(#curvedHighlight)" />
    <!-- Reflejo inferior cálido de atardecer derecho -->
    <path d="M 455 320 Q 520 370 585 320 Q 560 375 520 375 Q 480 375 455 320 Z" fill="#DE6536" fill-opacity="0.4" />

    <!-- Remaches dorados de bisagra alemana -->
    <circle cx="195" cy="275" r="2.2" fill="#FFE099" stroke="#5C2D18" stroke-width="0.8" />
    <circle cx="195" cy="283" r="2.2" fill="#FFE099" stroke="#5C2D18" stroke-width="0.8" />
    <circle cx="605" cy="275" r="2.2" fill="#FFE099" stroke="#5C2D18" stroke-width="0.8" />
    <circle cx="605" cy="283" r="2.2" fill="#FFE099" stroke="#5C2D18" stroke-width="0.8" />

    <!-- Destellos superiores en el borde del arco -->
    <path d="M 220 230 Q 280 215 340 230" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M 460 230 Q 520 215 580 230" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Píldora de Identificación -->
  <g transform="translate(40, 40)">
    <rect width="180" height="34" rx="17" fill="#6E3114" fill-opacity="0.9" />
    <circle cx="20" cy="17" r="4.5" fill="#F0A045" />
    <text x="34" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#FFF5EA" letter-spacing="1">MR-02 // SELENE</text>
  </g>

  <!-- Píldora de Calibración -->
  <g transform="translate(600, 525)">
    <rect width="160" height="30" rx="15" fill="#D97A2C" fill-opacity="0.92" />
    <text x="80" y="19" font-family="monospace" font-size="10.5" font-weight="700" fill="#FAF5EE" text-anchor="middle" letter-spacing="1.2">51▪21-142 • BIO-8MM</text>
  </g>
</svg>
