<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Fondo de atardecer cálido -->
    <radialGradient id="atlasSky" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FCF3E8" />
      <stop offset="35%" stop-color="#F5E0CD" />
      <stop offset="70%" stop-color="#E8CBB3" />
      <stop offset="100%" stop-color="#D9B79B" />
    </radialGradient>

    <!-- Resplandor solar -->
    <radialGradient id="atlasFlare" cx="30%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#EB9134" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#DE6536" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0" />
    </radialGradient>

    <!-- Acetato Grueso Habana Café Tostado -->
    <linearGradient id="chunkyHavana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A261A" />
      <stop offset="30%" stop-color="#26120B" />
      <stop offset="60%" stop-color="#5E3320" />
      <stop offset="85%" stop-color="#1A0B06" />
      <stop offset="100%" stop-color="#3B1C11" />
    </linearGradient>

    <!-- Bisel de acetato 8mm facetado -->
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EAA168" stop-opacity="0.85" />
      <stop offset="20%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#DE6536" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1A0B06" />
    </linearGradient>

    <!-- Lente Mineral Castaño Cálido Polarizado -->
    <linearGradient id="chestnutLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E100B" />
      <stop offset="45%" stop-color="#331A12" />
      <stop offset="75%" stop-color="#6B3724" />
      <stop offset="90%" stop-color="#E07A44" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadowFilter5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="24" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.35" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#atlasSky)" />
  <circle cx="280" cy="180" r="320" fill="url(#atlasFlare)" />

  <ellipse cx="400" cy="425" rx="310" ry="45" fill="#26120B" fill-opacity="0.25" />
  <ellipse cx="400" cy="422" rx="240" ry="25" fill="#26120B" fill-opacity="0.2" />

  <!-- MONTURA: MR-05 ATLAS STRUCTURE (CUADRADO BRUTALISTA DE ACETATO GRUESO) -->
  <g filter="url(#shadowFilter5)">
    <!-- Varillas en perspectiva detrás -->
    <path d="M 160 300 Q 120 290 75 305 Q 65 308 55 315 L 65 320 Q 85 308 130 304 L 165 310 Z" fill="#26120B" opacity="0.65" />
    <path d="M 640 300 Q 680 290 725 305 Q 735 308 745 315 L 735 320 Q 715 308 670 304 L 635 310 Z" fill="#26120B" opacity="0.65" />

    <!-- Ojo Izquierdo Cuadrado Grueso -->
    <path d="M 155 235 L 365 235 Q 375 235 375 245 L 370 365 Q 370 385 350 385 L 175 385 Q 155 385 155 365 L 145 245 Q 145 235 155 235 Z" fill="url(#chunkyHavana)" stroke="url(#facetHighlight)" stroke-width="4.5" />
    <!-- Lente Izquierda -->
    <path d="M 180 255 L 345 255 Q 355 255 355 268 L 348 355 Q 348 370 332 370 L 198 370 Q 182 370 182 355 L 175 268 Q 175 255 180 255 Z" fill="url(#chestnutLens)" />
    <!-- Reflejo diagonal -->
    <path d="M 190 260 L 335 260 L 295 365 L 190 345 Z" fill="#FFFFFF" fill-opacity="0.12" />
    <path d="M 185 330 Q 260 320 345 325 L 345 355 Q 345 368 330 368 L 200 368 Q 185 368 185 355 Z" fill="#DE6536" fill-opacity="0.32" />

    <!-- Puente Central Ancho de Acetato -->
    <path d="M 365 265 Q 400 258 435 265 L 435 295 Q 400 288 365 295 Z" fill="url(#chunkyHavana)" stroke="url(#facetHighlight)" stroke-width="2.5" />

    <!-- Ojo Derecho Cuadrado Grueso -->
    <path d="M 435 235 L 645 235 Q 655 235 655 245 L 645 365 Q 645 385 625 385 L 450 385 Q 430 385 430 365 L 425 245 Q 425 235 435 235 Z" fill="url(#chunkyHavana)" stroke="url(#facetHighlight)" stroke-width="4.5" />
    <!-- Lente Derecha -->
    <path d="M 450 255 L 615 255 Q 625 255 625 268 L 618 355 Q 618 370 602 370 L 468 370 Q 452 370 452 355 L 445 268 Q 445 255 450 255 Z" fill="url(#chestnutLens)" />
    <!-- Reflejo diagonal derecho -->
    <path d="M 460 260 L 605 260 L 565 365 L 460 345 Z" fill="#FFFFFF" fill-opacity="0.12" />
    <path d="M 455 330 Q 530 320 615 325 L 615 355 Q 615 368 600 368 L 470 368 Q 455 368 455 355 Z" fill="#DE6536" fill-opacity="0.32" />

    <!-- Remaches de latón macizo -->
    <circle cx="160" cy="250" r="2.5" fill="#E8B878" stroke="#1A0B06" stroke-width="0.8" />
    <circle cx="167" cy="250" r="2.5" fill="#E8B878" stroke="#1A0B06" stroke-width="0.8" />
    <circle cx="633" cy="250" r="2.5" fill="#E8B878" stroke="#1A0B06" stroke-width="0.8" />
    <circle cx="640" cy="250" r="2.5" fill="#E8B878" stroke="#1A0B06" stroke-width="0.8" />

    <!-- Líneas de corte de bisel superior -->
    <line x1="165" y1="237" x2="355" y2="237" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" />
    <line x1="445" y1="237" x2="635" y2="237" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Píldoras de Info -->
  <g transform="translate(40, 40)">
    <rect width="180" height="34" rx="17" fill="#26120B" fill-opacity="0.9" />
    <circle cx="20" cy="17" r="4.5" fill="#E07A44" />
    <text x="34" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#FAF5EE" letter-spacing="1">MR-05 // ATLAS</text>
  </g>

  <g transform="translate(600, 525)">
    <rect width="160" height="30" rx="15" fill="#5E3320" fill-opacity="0.92" />
    <text x="80" y="19" font-family="monospace" font-size="10.5" font-weight="700" fill="#FAF5EE" text-anchor="middle" letter-spacing="1.2">53▪19-148 • ACETATO 8MM</text>
  </g>
</svg>
