<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Fondo de atardecer rosado cálido -->
    <radialGradient id="luminaSky" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#FFF5F0" />
      <stop offset="35%" stop-color="#FCE6DC" />
      <stop offset="70%" stop-color="#F2D0C2" />
      <stop offset="100%" stop-color="#E2B7A5" />
    </radialGradient>

    <!-- Resplandor solar crepuscular -->
    <radialGradient id="sunsetGlowPink" cx="50%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#F28E63" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#DE6536" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#DE6536" stop-opacity="0" />
    </radialGradient>

    <!-- Acetato Rosa Ahumado Cuarzo / Ocaso -->
    <linearGradient id="roseQuartzAcetate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#542B28" />
      <stop offset="30%" stop-color="#361715" />
      <stop offset="60%" stop-color="#733A35" />
      <stop offset="85%" stop-color="#240D0C" />
      <stop offset="100%" stop-color="#4A2220" />
    </linearGradient>

    <!-- Bisel de ceja cat-eye facetada -->
    <linearGradient id="catEyeFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD4C4" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#FCA888" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#240D0C" />
    </linearGradient>

    <!-- Lente Mineral Rosa Atardecer / Ámbar -->
    <linearGradient id="roseSunsetLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211012" />
      <stop offset="45%" stop-color="#3D1C22" />
      <stop offset="75%" stop-color="#783439" />
      <stop offset="90%" stop-color="#E67B67" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#EB9134" stop-opacity="0.9" />
    </linearGradient>

    <filter id="shadowFilter6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="15" />
      <feOffset dx="0" dy="22" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#luminaSky)" />
  <circle cx="400" cy="180" r="320" fill="url(#sunsetGlowPink)" />

  <ellipse cx="400" cy="425" rx="300" ry="42" fill="#361715" fill-opacity="0.22" />
  <ellipse cx="400" cy="422" rx="230" ry="24" fill="#361715" fill-opacity="0.18" />

  <!-- MONTURA: MR-06 LUMINA CAT-EYE -->
  <g filter="url(#shadowFilter6)">
    <!-- Varillas en perspectiva detrás -->
    <path d="M 160 280 Q 120 270 75 285 Q 65 288 55 295 L 65 300 Q 85 288 130 284 L 165 290 Z" fill="#361715" opacity="0.65" />
    <path d="M 640 280 Q 680 270 725 285 Q 735 288 745 295 L 735 300 Q 715 288 670 284 L 635 290 Z" fill="#361715" opacity="0.65" />

    <!-- Ojo Izquierdo Cat-Eye Geométrico con picos afilados -->
    <path d="M 140 230 L 355 245 Q 370 245 370 260 L 360 355 Q 350 380 295 385 Q 225 385 190 355 L 140 230 Z" fill="url(#roseQuartzAcetate)" stroke="url(#catEyeFacet)" stroke-width="3.8" />
    <!-- Lente Izquierda -->
    <path d="M 160 245 L 342 255 Q 355 255 355 268 L 345 348 Q 338 370 295 372 Q 235 372 205 348 L 160 245 Z" fill="url(#roseSunsetLens)" />
    <!-- Reflejos -->
    <path d="M 165 248 L 325 258 L 290 365 L 195 330 Z" fill="#FFFFFF" fill-opacity="0.15" />
    <path d="M 210 330 Q 275 365 340 335 Q 320 370 290 370 Q 250 370 210 330 Z" fill="#E67B67" fill-opacity="0.4" />

    <!-- Puente Central -->
    <path d="M 360 265 Q 400 255 440 265 L 435 288 Q 400 278 365 288 Z" fill="url(#roseQuartzAcetate)" stroke="url(#catEyeFacet)" stroke-width="2" />

    <!-- Ojo Derecho Cat-Eye Geométrico con picos afilados -->
    <path d="M 445 245 L 660 230 L 610 355 Q 575 385 505 385 Q 450 380 440 355 L 430 260 Q 430 245 445 245 Z" fill="url(#roseQuartzAcetate)" stroke="url(#catEyeFacet)" stroke-width="3.8" />
    <!-- Lente Derecha -->
    <path d="M 458 255 L 640 245 L 595 348 Q 565 372 505 372 Q 462 370 455 348 L 445 268 Q 445 255 458 255 Z" fill="url(#roseSunsetLens)" />
    <!-- Reflejos derecho -->
    <path d="M 475 258 L 635 248 L 605 330 L 510 365 Z" fill="#FFFFFF" fill-opacity="0.15" />
    <path d="M 460 335 Q 525 365 590 330 Q 550 370 510 370 Q 480 370 460 335 Z" fill="#E67B67" fill-opacity="0.4" />

    <!-- Remaches dorados en las alas cat-eye -->
    <circle cx="150" cy="242" r="2.2" fill="#FFD4C4" stroke="#240D0C" stroke-width="0.8" />
    <circle cx="650" cy="242" r="2.2" fill="#FFD4C4" stroke="#240D0C" stroke-width="0.8" />

    <!-- Destello en el ala afilada superior -->
    <path d="M 142 232 L 350 245" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" />
    <path d="M 450 245 L 658 232" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Píldoras de Info -->
  <g transform="translate(40, 40)">
    <rect width="180" height="34" rx="17" fill="#361715" fill-opacity="0.9" />
    <circle cx="20" cy="17" r="4.5" fill="#E67B67" />
    <text x="34" y="21" font-family="monospace" font-size="11" font-weight="700" fill="#FFF5F0" letter-spacing="1">MR-06 // LUMINA</text>
  </g>

  <g transform="translate(600, 525)">
    <rect width="160" height="30" rx="15" fill="#733A35" fill-opacity="0.92" />
    <text x="80" y="19" font-family="monospace" font-size="10.5" font-weight="700" fill="#FAF5EE" text-anchor="middle" letter-spacing="1.2">52▪17-142 • CAT-EYE</text>
  </g>
</svg>
